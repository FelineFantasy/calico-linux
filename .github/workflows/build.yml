name: Build Calico Linux ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Distribution version (e.g. 1.0.0)'
        required: true
      release_notes:
        description: 'What is new'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build ISO in Fedora container
      run: |
        set -euo pipefail

        docker run --privileged --rm \
          -v "${{ github.workspace }}:/work" \
          -w /work \
          fedora:42 \
          bash -c '
            set -euo pipefail

            dnf install -y livecd-tools git

            rm -rf /tmp/ks
            git clone --branch f42 https://pagure.io/fedora-kickstarts.git /tmp/ks
            cp /work/calico.ks /tmp/ks/calico.ks

            cd /tmp/ks
            livecd-creator \
              --config=calico.ks \
              --fslabel="Calico-Linux-${{ github.event.inputs.version }}" \
              --cache=/var/cache/live \
              -p .

            cp ./*.iso /work/Calico-Linux-${{ github.event.inputs.version }}.iso
          '

    - name: Verify ISO and generate checksum
      run: |
        set -euo pipefail
        ISO="Calico-Linux-${{ github.event.inputs.version }}.iso"
        ls -lh "$ISO"
        sha256sum "$ISO" > "$ISO.sha256"
        cat "$ISO.sha256"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Calico-Linux-${{ github.event.inputs.version }}
        path: |
          Calico-Linux-${{ github.event.inputs.version }}.iso
          Calico-Linux-${{ github.event.inputs.version }}.iso.sha256

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.event.inputs.version }}
        name: Calico Linux v${{ github.event.inputs.version }}
        body: ${{ github.event.inputs.release_notes }}
        files: |
          Calico-Linux-${{ github.event.inputs.version }}.iso
          Calico-Linux-${{ github.event.inputs.version }}.iso.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

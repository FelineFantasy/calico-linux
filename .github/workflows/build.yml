name: Build Calico Linux ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия дистрибутива (например, 1.0.0)'
        required: true
      release_notes:
        description: 'Что нового'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build ISO directly on Ubuntu Host
      run: |
        sudo apt-get update && sudo apt-get install -y dnf python3 git
        git clone https://pagure.io/fedora-kickstarts.git /tmp/ks
        cd /tmp/ks
        git checkout f43
        cp ${{ github.workspace }}/calico.ks ./calico.ks
        
        # Ставим инструменты сборки Fedora прямо в Ubuntu
        sudo dnf install -y --releasever=43 livecd-tools --installroot=/tmp/f43_root --setopt=reposdir=/tmp/ks
        
        # Запускаем сборку, используя всё свободное место Ubuntu (30+ ГБ)
        sudo livecd-creator --config=calico.ks --fslabel=Calico-Linux-${{ github.event.inputs.version }} --cache=/var/cache/live
        mv *.iso ${{ github.workspace }}/Calico-Linux-${{ github.event.inputs.version }}.iso

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.event.inputs.version }}
        name: Calico Linux v${{ github.event.inputs.version }}
        body: ${{ github.event.inputs.release_notes }}
        files: Calico-Linux-${{ github.event.inputs.version }}.iso
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

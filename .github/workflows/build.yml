name: Build Calico Linux ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Distribution version (e.g. 1.0.0)'
        required: true
      release_notes:
        description: 'What is new'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build ISO in Fedora container
      run: |
        set -euo pipefail

        docker run --privileged --rm --shm-size=6g \
          -v "${{ github.workspace }}:/work" \
          -w /work \
          fedora:42 \
          bash -c '
            set -euo pipefail

            dnf install -y livecd-tools git e2fsprogs
            dnf clean all
            rm -rf /var/cache/dnf/* /var/log/dnf* /var/log/yum* 2>/dev/null || true

            rm -rf /tmp/ks /tmp/lc /work/tmp /work/bigtmp
            mkdir -p /work/tmp /work/bigtmp /var/cache/live
            fallocate -l 12G /work/build.img 2>/dev/null || dd if=/dev/zero of=/work/build.img bs=1M count=12288
            mkfs.ext4 -F /work/build.img >/dev/null 2>&1
            mount -o loop /work/build.img /work/bigtmp
            export TMPDIR=/work/bigtmp
            export HOME=/work/bigtmp
            export XDG_CACHE_HOME=/work/bigtmp/cache

            git clone --branch f42 https://pagure.io/fedora-kickstarts.git /tmp/ks
            cp /work/calico.ks /tmp/ks/calico.ks
            cp -r /work/configs /tmp/ks/configs

            cd /tmp/ks
            livecd-creator \
              --config=./calico.ks \
              --fslabel="Calico-Linux-${{ github.event.inputs.version }}" \
              --cache=/var/cache/live \
              --tmpdir=/work/bigtmp

            cp -v ./*.iso /work/Calico-Linux-${{ github.event.inputs.version }}.iso 2>&1 | tail -5
          '

    - name: Verify ISO is bootable
      run: |
        set -euo pipefail
        ISO="Calico-Linux-${{ github.event.inputs.version }}.iso"

        # livecd-tools silently skips a missing initramfs, which yields an ISO
        # that cannot boot on any machine. Check the payload before publishing.
        sudo mkdir -p /mnt/iso
        sudo mount -o loop,ro "$ISO" /mnt/iso
        trap 'sudo umount /mnt/iso' EXIT

        # Print the payload so a failure below is diagnosable from the log.
        sudo find /mnt/iso -maxdepth 2 -type f -printf '%10s %p\n' | sort -k2

        for f in isolinux/vmlinuz0 isolinux/initrd0.img LiveOS/squashfs.img; do
          if [ ! -s "/mnt/iso/$f" ]; then
            echo "::error::$f is missing or empty - this ISO would not boot"
            exit 1
          fi
        done

        size=$(stat -c%s /mnt/iso/isolinux/initrd0.img)
        echo "isolinux/initrd0.img: $size bytes"
        if [ "$size" -lt 10000000 ]; then
          echo "::error::isolinux/initrd0.img is only $size bytes - looks broken"
          exit 1
        fi

    - name: Verify ISO and generate checksum
      run: |
        set -euo pipefail
        ISO="Calico-Linux-${{ github.event.inputs.version }}.iso"
        ls -lh "$ISO"
        sha256sum "$ISO" > "$ISO.sha256"
        cat "$ISO.sha256"

    - name: Check ISO fits GitHub release limit
      run: |
        set -euo pipefail
        ISO="Calico-Linux-${{ github.event.inputs.version }}.iso"
        size=$(stat -c%s "$ISO")
        limit=$((2 * 1024 * 1024 * 1024))
        echo "ISO is $size bytes, release assets must be smaller than $limit bytes"
        # Fail here instead of after the build: uploads of larger files are
        # rejected by the release API with a bare "size must be less than
        # 2147483648" error.
        if [ "$size" -ge "$limit" ]; then
          echo "::error::$ISO is $size bytes and cannot be attached to a release"
          exit 1
        fi
        if [ "$size" -ge $((limit - 64 * 1024 * 1024)) ]; then
          echo "::warning::$ISO is within 64 MiB of the release asset limit"
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Calico-Linux-${{ github.event.inputs.version }}
        path: |
          Calico-Linux-${{ github.event.inputs.version }}.iso
          Calico-Linux-${{ github.event.inputs.version }}.iso.sha256

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.event.inputs.version }}
        name: Calico Linux v${{ github.event.inputs.version }}
        body: ${{ github.event.inputs.release_notes }}
        files: |
          Calico-Linux-${{ github.event.inputs.version }}.iso
          Calico-Linux-${{ github.event.inputs.version }}.iso.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
